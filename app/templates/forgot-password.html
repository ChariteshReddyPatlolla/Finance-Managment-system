<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Manager - Forgot Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forgot-password.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Forgot Password</h1>
            <p>Enter your email to reset your password</p>
        </div>

        <div class="form-container">
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                    <div class="error-message" id="emailError">Please enter a valid email</div>
                </div>

                <button type="submit" class="btn">Reset Password</button>
            </form>

            <div class="success-message" id="successMessage">
                Password reset link has been sent to your email. Please check your inbox.
            </div>

            <div class="links">
                <a href="/index">Back to Sign In</a>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/forgot-password.js') }}"></script>
</body>
</html>
